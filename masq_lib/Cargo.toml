[package]
name = "masq_lib"
version = "0.7.3"
authors = ["Dan Wiebe <dnwiebe@gmail.com>", "MASQ"]
license = "GPL-3.0-only"
description = "Code common to Node and masq; also, temporarily, to dns_utility"
edition = "2021"
workspace = "../node"

[dependencies]
actix = { workspace = true }
async-channel = "2.3.1"
async-trait = "0.1.80"
base64 = { workspace = true }
clap = {version = "4.5.6", features = [ "string", "color", "cargo" ]}
const_format = "0.2.32"
crossbeam-channel = "0.5.13"
dirs = { workspace = true }
ethereum-types = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
itertools = "0.13.0"
lazy_static = "1.4.0"
log = "0.4.8"
rand = { workspace = true }
regex = "1.10.4"
rustc-hex = "2.1.0"
serde = "1.0.203"
serde_derive = "1.0.203"
serde_json = "1.0.117"
soketto = { workspace = true }
time = {version = "0.3.36", features = [ "formatting" ]}
tiny-hderive = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "io-std"]}
tokio-util = { workspace = true, features = ["compat"]}
toml = "0.8.14"
url = { workspace = true }

[features]
no_test_share = []
log_recipient_test = []

[target.'cfg(not(target_os = "windows"))'.dependencies]
nix = "0.23.0"

[lib]
name = "masq_lib"
path = "src/lib.rs"
