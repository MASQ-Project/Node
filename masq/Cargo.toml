[package]
name = "masq"
version = "0.7.3"
authors = ["Dan Wiebe <dnwiebe@gmail.com>", "MASQ"]
license = "GPL-3.0-only"
description = "Reference implementation of user interface for MASQ Node"
edition = "2021"
workspace = "../node"

# See more keys and their definitions at  https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
atty = "0.2.14"
clap = { version = "4.6.0", features = ["color"] }
itertools = "0.14.0"
lazy_static = "1.5.0"
liso = {version ="1.2.1", default-features = false, features = ["history"]}
masq_lib = { path = "../masq_lib" }
num = "0.4.3"
regex = "1.12.3"
soketto = { workspace = true }
thousands = "0.2.0"
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
futures = "0.3.32"
async-channel = "2.5.0"
async-trait = "0.1.89"

[target.'cfg(not(target_os = "windows"))'.dependencies]
nix = "0.31.2"

[dev-dependencies]
time = { version = "0.3.47", features = ["macros"] }

[lib]
name = "masq_cli_lib"
path = "src/lib.rs"

[[bin]]
name = "masq"
path = "src/main.rs"
